<!-- Activity-bar icon: 24x24, single colour, paths flat (no <g>, no
     transform, coords native to the viewBox) — the shape VS Code's own
     icons use. VS Code applies this as a CSS mask and recolours it, so
     currentColor is discarded at render time.

     Known upstream bug: in a Remote-SSH window this icon is BLANK,
     because the extension resolves to vscode-managed-remote-resource://
     and the workbench origin is vscode-file://vscode-app, which CORS
     blocks (microsoft/vscode#319834; hits SVG icons and WOFF icon fonts
     alike, so contributes.icons is not a workaround). Nothing here can
     fix it — do not "repair" this file in response to a blank icon. -->
