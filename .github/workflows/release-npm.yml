name: "Release: npm packages"

on:
  push:
    tags: ["v*"]
  # Manual re-trigger after workflow / OIDC fixes without re-tagging.
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release-core
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # Node 24 ships npm 11.5+ required for OIDC Trusted Publishing.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: npm install

      # Publish order: shared core → engines → umbrella.
      # core is a transitive dep (not a product install); stage/sketch/umbrella
      # are the consumer packages. See .claude/notes/package-architecture.md.
      - name: Build core
        run: npm run build:core

      - name: Build stage
        run: npm run build:stage

      - name: Check stage pack surface
        run: npm run check:pack

      - name: Build sketch
        run: npm run build:sketch

      - name: Build umbrella
        run: npm run build:umbrella

      - name: Publish @molcrafts/molvis-core
        run: npm publish -w @molcrafts/molvis-core --provenance --access public

      - name: Publish @molcrafts/molvis-stage
        run: npm publish -w @molcrafts/molvis-stage --provenance --access public

      - name: Publish @molcrafts/molvis-sketch
        run: npm publish -w @molcrafts/molvis-sketch --provenance --access public

      - name: Publish @molcrafts/molvis
        run: npm publish -w @molcrafts/molvis --provenance --access public
