name: lint

# Same jobs in every context (feature branch or dev/master, fork or
# upstream); see "CI" in docs/development/testing.md. A PR from a branch of
# the same repository skips what its push already ran.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [dev, master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' && !contains(fromJSON('["refs/heads/dev","refs/heads/master","refs/heads/main"]'), github.ref) }}

jobs:
  biome:
    name: lint / biome
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node
      - run: npx biome check

  # Only core/ imports @molcrafts/molrs; every workspace and the Python
  # package share one version and pin it; python/uv.lock matches pyproject.
  guards:
    name: lint / guards
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node
        with:
          install: "false"
      - uses: ./.github/actions/setup-python
      - run: npm run check:molrs-gateway
      - run: npm run check:versions
      - run: uv lock --check --project python

  # Package types come from dist via exports; the script builds the engines.
  typecheck:
    name: lint / typecheck
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node
      - run: npm run typecheck
