name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: Biome lint & format check
        run: npx biome check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      # Package types come from dist via exports; build engines first.
      - name: Typecheck (core / page / vsc-ext)
        run: npm run typecheck

  test-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Test core
        run: npm run test:core

  build-core:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test-core]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      # Engines first: check:pack inspects stage/dist (not core alone).
      - name: Build core + stage
        run: npm run build:core && npm run build:stage

      # Pack gate: ban inspector/gui-editor/loaders in dist and enforce the
      # CDN elements size budget. Catches the 0.0.11 multi-MB debug-UI leak.
      - name: Check pack surface
        run: npm run check:pack

  build-page:
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      # Hosts resolve engines via package exports → dist (workspace link).
      - name: Build engines
        run: npm run build:core && npm run build:stage && npm run build:sketch

      - name: Build page
        run: npm run build:page

  build-vsc-ext:
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: Build engines
        run: npm run build:core && npm run build:stage && npm run build:sketch

      - name: Build vsc-ext
        run: npm run build:vsc-ext
