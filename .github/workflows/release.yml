name: release

# A `v*` tag on MolCrafts publishes every surface of the shared version:
#   release / npm      @molcrafts/molvis-* engines, viewers, plugin SDK and
#                      the root umbrella (npm trusted publishing)
#   release / python   molcrafts-molvis with the page bundle (PyPI trusted
#                      publishing)
#   release / vsc-ext  the VSIX on the VS Marketplace and Open VSX
# Each job's environment is named after its registry: npm, pypi,
# vscode-marketplace (VSCE_PAT, OVSX_PAT). workflow_dispatch is a dry run
# anywhere: everything builds and packs, nothing is uploaded, and no job
# enters an environment.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# One group per file, workflow, event and ref. Under workflow_call (release.yml
# running lint/test) github.workflow and github.event_name are the caller's, so
# a called run never shares, and so never cancels, a direct run's group.
concurrency:
  group: release-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Where this run happens, decided once: MolCrafts/molcrafts-ci/actions/ci-context.
  context:
    name: release / context
    runs-on: ubuntu-latest
    outputs:
      tier: ${{ steps.context.outputs.tier }}
      upstream: ${{ steps.context.outputs.upstream }}
      integration: ${{ steps.context.outputs.integration }}
      skip-pr: ${{ steps.context.outputs.skip-pr }}
      cancel: ${{ steps.context.outputs.cancel }}
    steps:
      - id: context
        uses: MolCrafts/molcrafts-ci/actions/ci-context@master

  npm:
    name: release / npm
    needs: context
    if: github.event_name == 'workflow_dispatch' || needs.context.outputs.upstream == 'true'
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'push' && 'npm' || '' }}
    permissions:
      contents: read
      id-token: write
    # setup-node's registry-url writes a placeholder NODE_AUTH_TOKEN into
    # .npmrc, which overrides OIDC trusted publishing and 404s the PUT.
    # Empty, npm >= 11.5 (Node 24) publishes through the id-token.
    env:
      NODE_AUTH_TOKEN: ""
      # Upload only on a tag push to MolCrafts; anything else packs.
      PUBLISH: ${{ github.event_name == 'push' && needs.context.outputs.upstream == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: MolCrafts/molcrafts-ci/actions/setup-node@master
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - run: npm run check:versions
      # The umbrella re-exports the plugin SDK, so every workspace is on the
      # registry before it.
      - run: |
          npm run build:core
          npm run build:stage
          npm run build:stage-viewer
          npm run build:sketch-viewer
          npm run check:pack
          npm run build:sketch
          npm run build:plugin
      - name: Publish core, engines, viewers, plugin SDK, then the umbrella
        run: |
          set -euo pipefail
          if [ "$PUBLISH" = true ]; then publish="npm publish --provenance --access public"; else publish="npm pack --dry-run"; fi
          for w in @molcrafts/molvis-core @molcrafts/molvis-stage @molcrafts/molvis-stage-viewer \
                   @molcrafts/molvis-sketch @molcrafts/molvis-sketch-viewer @molcrafts/molvis-plugin; do
            $publish -w "$w"
          done
          $publish

  python:
    name: release / python
    needs: context
    if: github.event_name == 'workflow_dispatch' || needs.context.outputs.upstream == 'true'
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'push' && 'pypi' || '' }}
    env:
      # Upload only on a tag push to MolCrafts; anything else packs.
      PUBLISH: ${{ github.event_name == 'push' && needs.context.outputs.upstream == 'true' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: MolCrafts/molcrafts-ci/actions/setup-node@master
      - uses: MolCrafts/molcrafts-ci/actions/setup-python@master
      # The page bundle goes into python/src/molvis/dist/; the build backend
      # then finds it fresh and does not rebuild it.
      - run: npm run build:page
      - run: uv build --project python --out-dir python/dist
      - if: env.PUBLISH == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist/

  vsc-ext:
    name: release / vsc-ext
    needs: context
    if: github.event_name == 'workflow_dispatch' || needs.context.outputs.upstream == 'true'
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'push' && 'vscode-marketplace' || '' }}
    env:
      # Upload only on a tag push to MolCrafts; anything else packs.
      PUBLISH: ${{ github.event_name == 'push' && needs.context.outputs.upstream == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: MolCrafts/molcrafts-ci/actions/setup-node@master
      - run: npm run build:vsc-ext
      - working-directory: vsc-ext
        run: npx vsce package --no-dependencies -o molvis.vsix
      - if: env.PUBLISH == 'true'
        uses: HaaLeo/publish-vscode-extension@v2
        with:
          pat: ${{ secrets.VSCE_PAT }}
          registryUrl: https://marketplace.visualstudio.com
          extensionFile: vsc-ext/molvis.vsix
          skipDuplicate: true
      - if: env.PUBLISH == 'true'
        uses: HaaLeo/publish-vscode-extension@v2
        with:
          pat: ${{ secrets.OVSX_PAT }}
          registryUrl: https://open-vsx.org
          extensionFile: vsc-ext/molvis.vsix
          skipDuplicate: true
